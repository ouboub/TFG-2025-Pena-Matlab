name: Notify on push

on:
  push:
    branches:
      - default


jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send email on push
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "GitHub Push to ${{ github.repository }}"
          to: oub@mat.ucm.es, diegfe03@ucm.es
          from: GitHub Actions <youremail@example.com>
          body: |
            A push was made to ${{ github.repository }} on branch ${{ github.ref }}.

            Commit message: ${{ github.event.head_commit.message }}
            Pusher: ${{ github.actor }}
            URL: ${{ github.event.head_commit.url }}

